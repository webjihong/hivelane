# 소개 페이지(site/)를 GitHub Pages 로 올린다. 화면 사진은 docs/images 에서 복사한다.
name: Pages
on:
  push:
    branches: [main]
    paths: ['site/**', 'docs/images/**', '.github/workflows/pages.yml']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: 사진 복사
        run: cp -R docs/images site/images
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
